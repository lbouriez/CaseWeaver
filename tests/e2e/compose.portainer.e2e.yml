# Test-only overlay for the source-free Portainer topology. It adds a private,
# deterministic OIDC provider and a Pages-like static TLS host. Operators never
# deploy this file.

services:
  oidc-provider:
    image: caseweaver-e2e-fixtures:portainer-e2e
    profiles: ["standalone"]
    command: ["node", "/fixtures/oidc-provider.mjs"]
    environment:
      CASEWEAVER_E2E_OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in the generated E2E environment.}
      CASEWEAVER_E2E_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in the generated E2E environment.}
      CASEWEAVER_E2E_OIDC_CLIENT_SECRET_FILE: /run/caseweaver-e2e/client-secret
      CASEWEAVER_E2E_OIDC_CERTIFICATE_FILE: /run/caseweaver-e2e/certificate.pem
      CASEWEAVER_E2E_OIDC_PRIVATE_KEY_FILE: /run/caseweaver-e2e/private-key.pem
      CASEWEAVER_E2E_OIDC_PORT: ${CASEWEAVER_E2E_OIDC_PORT:?Set CASEWEAVER_E2E_OIDC_PORT in the generated E2E environment.}
    volumes:
      - ${CASEWEAVER_OIDC_CLIENT_SECRET_FILE:?Set CASEWEAVER_OIDC_CLIENT_SECRET_FILE.}:/run/caseweaver-e2e/client-secret:ro
      - ${CASEWEAVER_TLS_CERTIFICATE_FILE:?Set CASEWEAVER_TLS_CERTIFICATE_FILE.}:/run/caseweaver-e2e/certificate.pem:ro
      - ${CASEWEAVER_TLS_PRIVATE_KEY_FILE:?Set CASEWEAVER_TLS_PRIVATE_KEY_FILE.}:/run/caseweaver-e2e/private-key.pem:ro
      - ${CASEWEAVER_E2E_OIDC_FIXTURE_PATH:?Set CASEWEAVER_E2E_OIDC_FIXTURE_PATH.}:/fixtures/oidc-provider.mjs:ro
    ports:
      - "127.0.0.1:${CASEWEAVER_E2E_OIDC_PORT:?Set CASEWEAVER_E2E_OIDC_PORT in the generated E2E environment.}:${CASEWEAVER_E2E_OIDC_PORT:?Set CASEWEAVER_E2E_OIDC_PORT in the generated E2E environment.}"
    networks:
      egress:
        ipv4_address: ${CASEWEAVER_E2E_OIDC_IP:?Set CASEWEAVER_E2E_OIDC_IP in the generated E2E environment.}
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('node:https').get({host:'127.0.0.1',port:Number(process.env.CASEWEAVER_E2E_OIDC_PORT),path:'/issuer/.well-known/openid-configuration',rejectUnauthorized:false},(response)=>process.exit(response.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  standalone:
    extra_hosts:
      - "oidc.caseweaver.test:${CASEWEAVER_E2E_OIDC_IP:?Set CASEWEAVER_E2E_OIDC_IP in the generated E2E environment.}"
    depends_on:
      oidc-provider:
        condition: service_healthy
        required: true

  admin-pages:
    image: ${CASEWEAVER_ADMIN_IMAGE:?Set CASEWEAVER_ADMIN_IMAGE in the generated E2E environment.}
    profiles: ["standalone"]
    environment:
      CASEWEAVER_ADMIN_API_BASE_URL: ${CASEWEAVER_E2E_API_ORIGIN:?Set CASEWEAVER_E2E_API_ORIGIN in the generated E2E environment.}
      CASEWEAVER_ADMIN_UI_TITLE: CaseWeaver External E2E Control Room
    networks:
      - application
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
      - /var/cache/nginx:uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/caseweaver-runtime-config.json && nginx -t && wget -q -O /dev/null http://127.0.0.1:8080/runtime-config.json"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  pages-edge:
    image: ${CASEWEAVER_EDGE_IMAGE:?Set CASEWEAVER_EDGE_IMAGE in the generated E2E environment.}
    profiles: ["standalone"]
    ports:
      - "127.0.0.1:${CASEWEAVER_E2E_PAGES_HTTPS_PORT:?Set CASEWEAVER_E2E_PAGES_HTTPS_PORT in the generated E2E environment.}:8443"
    volumes:
      - caseweaver_portainer_edge_runtime:/run/caseweaver-edge:ro
      - ${CASEWEAVER_E2E_PAGES_NGINX_CONFIG:?Set CASEWEAVER_E2E_PAGES_NGINX_CONFIG in the generated E2E environment.}:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ingress
      - application
    depends_on:
      edge-material:
        condition: service_healthy
        required: true
      admin-pages:
        condition: service_healthy
        required: true
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /var/run:uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/runtime-config.json"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
