# Test-only HTTPS facade that represents a separately hosted Pages console.
# The production console is Cloudflare Pages; this file exists only so Chromium
# can exercise a genuinely cross-site cookie flow without external credentials.
server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /run/caseweaver-edge/certificate.pem;
    ssl_certificate_key /run/caseweaver-edge/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $admin_upstream admin-pages:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://$admin_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
