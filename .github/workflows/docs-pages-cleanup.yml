name: Documentation portal cleanup

on:
  pull_request:
    types:
      - closed
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list deployments without deleting)"
        required: false
        default: false
        type: boolean
      keep_production:
        description: "Number of production deployments to keep"
        required: false
        default: "5"
        type: string

permissions:
  pull-requests: read

jobs:
  cleanup-pr:
    name: Cleanup closed PR preview
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages-preview
    concurrency:
      group: cloudflare-pages-preview
      cancel-in-progress: false
    steps:
      - name: Check preview cleanup configuration
        id: configuration
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail

          is_safe_account_id() {
            [[ "$1" =~ ^[A-Fa-f0-9]{32}$ ]]
          }

          is_safe_project_slug() {
            [[ "$1" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]
          }

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare preview metadata is absent; skipping external deletion."
            exit 0
          fi

          if ! is_safe_account_id "$CLOUDFLARE_ACCOUNT_ID" || ! is_safe_project_slug "$CLOUDFLARE_PAGES_PROJECT"; then
            echo "Cloudflare preview cleanup metadata is invalid." >&2
            exit 1
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "The preview Cloudflare API token is unavailable." >&2
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Delete preview deployments for the closed PR
        if: steps.configuration.outputs.configured == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || secrets.CLOUDFLARE_PAGES_PROJECT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Pull request metadata is invalid." >&2; exit 1; }
          BRANCH="pr-${PR_NUMBER}"

          fetch_deployments() {
            local environment="$1"
            local page=1
            local deployments='[]'
            local endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/deployments"

            while :; do
              local response
              response="$(curl --fail-with-body --silent --show-error --get "$endpoint" \
                --data-urlencode "env=${environment}" \
                --data-urlencode "page=${page}" \
                --data-urlencode 'per_page=100' \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json')"
              printf '%s' "$response" | jq -e '.success == true and (.result | type == "array")' >/dev/null || {
                echo "Cloudflare rejected the deployment list request." >&2
                exit 1
              }
              deployments="$(jq -cn --argjson existing "$deployments" --argjson next "$(printf '%s' "$response" | jq -c '.result')" '$existing + $next')"

              local total_pages
              total_pages="$(printf '%s' "$response" | jq -r '.result_info.total_pages // 1')"
              [[ "$total_pages" =~ ^[1-9][0-9]*$ ]] || { echo "Cloudflare pagination metadata is invalid." >&2; exit 1; }
              (( page < total_pages )) || break
              (( page < 1000 )) || { echo "Cloudflare pagination exceeds the safety limit." >&2; exit 1; }
              page=$((page + 1))
            done

            printf '%s' "$deployments"
          }

          delete_deployment() {
            local deployment_id="$1"
            local response
            local endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/deployments/${deployment_id}?force=true"

            [[ "$deployment_id" =~ ^[A-Za-z0-9_-]{1,128}$ ]] || { echo "Cloudflare returned an invalid deployment identifier." >&2; exit 1; }
            response="$(curl --fail-with-body --silent --show-error -X DELETE "$endpoint" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json')"
            printf '%s' "$response" | jq -e '.success == true' >/dev/null || {
              echo "Cloudflare rejected a deployment deletion request." >&2
              exit 1
            }
          }

          while IFS= read -r deployment_id; do
            [ -n "$deployment_id" ] || continue
            echo "Deleting the closed pull request preview deployment."
            delete_deployment "$deployment_id"
          done < <(
            fetch_deployments preview | jq -r --arg branch "$BRANCH" '
              .[]? |
              select(.deployment_trigger.metadata.branch == $branch) |
              .id
            '
          )

  cleanup-stale-previews:
    name: Cleanup stale documentation previews
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages-preview
    concurrency:
      group: cloudflare-pages-preview
      cancel-in-progress: false
    steps:
      - name: Check preview cleanup configuration
        id: configuration
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || secrets.CLOUDFLARE_PAGES_PROJECT }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          is_safe_account_id() {
            [[ "$1" =~ ^[A-Fa-f0-9]{32}$ ]]
          }

          is_safe_project_slug() {
            [[ "$1" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]
          }

          if [ "$DRY_RUN" != 'true' ] && [ "$DRY_RUN" != 'false' ]; then
            echo "dry_run must be true or false." >&2
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare preview metadata is absent; skipping external deletion."
            exit 0
          fi

          if ! is_safe_account_id "$CLOUDFLARE_ACCOUNT_ID" || ! is_safe_project_slug "$CLOUDFLARE_PAGES_PROJECT"; then
            echo "Cloudflare preview cleanup metadata is invalid." >&2
            exit 1
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "The preview Cloudflare API token is unavailable." >&2
            exit 1
          fi

          printf 'configured=true\ndry_run=%s\n' "$DRY_RUN" >> "$GITHUB_OUTPUT"
      - name: Fetch open pull requests
        if: steps.configuration.outputs.configured == 'true'
        id: open_prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_prs="$(gh pr list --repo "${{ github.repository }}" --state open --limit 1000 --json number --jq '[.[].number]')"
          printf '%s' "$open_prs" | jq -e 'type == "array" and all(.[]; type == "number")' >/dev/null
          printf 'open_prs=%s\n' "$open_prs" >> "$GITHUB_OUTPUT"
      - name: Clean up preview deployments
        if: steps.configuration.outputs.configured == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || secrets.CLOUDFLARE_PAGES_PROJECT }}
          OPEN_PRS: ${{ steps.open_prs.outputs.open_prs }}
          DRY_RUN: ${{ steps.configuration.outputs.dry_run }}
        run: |
          set -euo pipefail

          fetch_deployments() {
            local page=1
            local deployments='[]'
            local endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/deployments"

            while :; do
              local response
              response="$(curl --fail-with-body --silent --show-error --get "$endpoint" \
                --data-urlencode 'env=preview' \
                --data-urlencode "page=${page}" \
                --data-urlencode 'per_page=100' \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json')"
              printf '%s' "$response" | jq -e '.success == true and (.result | type == "array")' >/dev/null || {
                echo "Cloudflare rejected the preview deployment list request." >&2
                exit 1
              }
              deployments="$(jq -cn --argjson existing "$deployments" --argjson next "$(printf '%s' "$response" | jq -c '.result')" '$existing + $next')"

              local total_pages
              total_pages="$(printf '%s' "$response" | jq -r '.result_info.total_pages // 1')"
              [[ "$total_pages" =~ ^[1-9][0-9]*$ ]] || { echo "Cloudflare pagination metadata is invalid." >&2; exit 1; }
              (( page < total_pages )) || break
              (( page < 1000 )) || { echo "Cloudflare pagination exceeds the safety limit." >&2; exit 1; }
              page=$((page + 1))
            done

            printf '%s' "$deployments"
          }

          delete_deployment() {
            local deployment_id="$1"
            local response
            local endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/deployments/${deployment_id}?force=true"

            [[ "$deployment_id" =~ ^[A-Za-z0-9_-]{1,128}$ ]] || { echo "Cloudflare returned an invalid deployment identifier." >&2; exit 1; }
            response="$(curl --fail-with-body --silent --show-error -X DELETE "$endpoint" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json')"
            printf '%s' "$response" | jq -e '.success == true' >/dev/null || {
              echo "Cloudflare rejected a deployment deletion request." >&2
              exit 1
            }
          }

          declare -A seen_branches=()
          while IFS=$'\t' read -r deployment_id branch; do
            [ -n "$deployment_id" ] && [ -n "$branch" ] || continue

            pr_number="${branch#pr-}"
            if ! printf '%s' "$OPEN_PRS" | jq -e --argjson pr "$pr_number" 'index($pr)' >/dev/null; then
              action='stale'
            elif [ -n "${seen_branches[$branch]:-}" ]; then
              action='duplicate'
            else
              seen_branches["$branch"]=1
              continue
            fi

            if [ "$DRY_RUN" = 'true' ]; then
              echo "Would delete a ${action} preview deployment."
            else
              echo "Deleting a ${action} preview deployment."
              delete_deployment "$deployment_id"
            fi
          done < <(
            fetch_deployments | jq -r '
              map(select(.deployment_trigger.metadata.branch != null)) |
              map(select(.deployment_trigger.metadata.branch | test("^pr-[0-9]+$"))) |
              sort_by(.created_on) | reverse |
              .[] |
              "\(.id)\t\(.deployment_trigger.metadata.branch)"
            '
          )

  cleanup-old-production:
    name: Cleanup old documentation production deployments
    if: |
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages-production
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    steps:
      - name: Check protected production cleanup configuration
        id: configuration
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || secrets.CLOUDFLARE_PAGES_PROJECT }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          KEEP_PRODUCTION: ${{ inputs.keep_production || '5' }}
        run: |
          set -euo pipefail

          is_safe_account_id() {
            [[ "$1" =~ ^[A-Fa-f0-9]{32}$ ]]
          }

          is_safe_project_slug() {
            [[ "$1" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]
          }

          if [ "$DRY_RUN" != 'true' ] && [ "$DRY_RUN" != 'false' ]; then
            echo "dry_run must be true or false." >&2
            exit 1
          fi

          if ! [[ "$KEEP_PRODUCTION" =~ ^[1-9][0-9]*$ ]]; then
            echo "keep_production must be a positive integer." >&2
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare production metadata is absent; skipping external deletion."
            exit 0
          fi

          if ! is_safe_account_id "$CLOUDFLARE_ACCOUNT_ID" || ! is_safe_project_slug "$CLOUDFLARE_PAGES_PROJECT"; then
            echo "Cloudflare production cleanup metadata is invalid." >&2
            exit 1
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "The protected Cloudflare API token is unavailable." >&2
            exit 1
          fi

          printf 'configured=true\ndry_run=%s\nkeep_production=%s\n' "$DRY_RUN" "$KEEP_PRODUCTION" >> "$GITHUB_OUTPUT"
      - name: Clean up old production deployments
        if: steps.configuration.outputs.configured == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || secrets.CLOUDFLARE_PAGES_PROJECT }}
          DRY_RUN: ${{ steps.configuration.outputs.dry_run }}
          KEEP_PRODUCTION: ${{ steps.configuration.outputs.keep_production }}
        run: |
          set -euo pipefail

          fetch_deployments() {
            local page=1
            local deployments='[]'
            local endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/deployments"

            while :; do
              local response
              response="$(curl --fail-with-body --silent --show-error --get "$endpoint" \
                --data-urlencode 'env=production' \
                --data-urlencode "page=${page}" \
                --data-urlencode 'per_page=100' \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json')"
              printf '%s' "$response" | jq -e '.success == true and (.result | type == "array")' >/dev/null || {
                echo "Cloudflare rejected the production deployment list request." >&2
                exit 1
              }
              deployments="$(jq -cn --argjson existing "$deployments" --argjson next "$(printf '%s' "$response" | jq -c '.result')" '$existing + $next')"

              local total_pages
              total_pages="$(printf '%s' "$response" | jq -r '.result_info.total_pages // 1')"
              [[ "$total_pages" =~ ^[1-9][0-9]*$ ]] || { echo "Cloudflare pagination metadata is invalid." >&2; exit 1; }
              (( page < total_pages )) || break
              (( page < 1000 )) || { echo "Cloudflare pagination exceeds the safety limit." >&2; exit 1; }
              page=$((page + 1))
            done

            printf '%s' "$deployments"
          }

          delete_deployment() {
            local deployment_id="$1"
            local response
            local endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/deployments/${deployment_id}?force=true"

            [[ "$deployment_id" =~ ^[A-Za-z0-9_-]{1,128}$ ]] || { echo "Cloudflare returned an invalid deployment identifier." >&2; exit 1; }
            response="$(curl --fail-with-body --silent --show-error -X DELETE "$endpoint" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json')"
            printf '%s' "$response" | jq -e '.success == true' >/dev/null || {
              echo "Cloudflare rejected a deployment deletion request." >&2
              exit 1
            }
          }

          keep_count=0
          while IFS= read -r deployment_id; do
            [ -n "$deployment_id" ] || continue

            if [ "$keep_count" -lt "$KEEP_PRODUCTION" ]; then
              keep_count=$((keep_count + 1))
              continue
            fi

            if [ "$DRY_RUN" = 'true' ]; then
              echo "Would delete an old production deployment."
            else
              echo "Deleting an old production deployment."
              delete_deployment "$deployment_id"
            fi
          done < <(
            fetch_deployments | jq -r '
              sort_by(.created_on) | reverse |
              .[] |
              .id
            '
          )
