name: caseweaver-local

# The normal local topology deliberately has three long-running containers:
# PostgreSQL, one standalone backend, and the Admin frontend.  API, verified
# webhook ingress, scheduler, durable worker, and outbox relay remain distinct
# modules in code but run inside the standalone backend process.
x-backend-image: &backend-image ${CASEWEAVER_BACKEND_IMAGE:-caseweaver-backend:local}
x-build-args: &build-args
  VERSION: ${CASEWEAVER_IMAGE_VERSION:-local}
  REVISION: ${CASEWEAVER_IMAGE_REVISION:-local}
  SOURCE: ${CASEWEAVER_IMAGE_SOURCE:-https://github.com/caseweaver/caseweaver}
  CREATED: ${CASEWEAVER_IMAGE_CREATED:-local}

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    environment:
      POSTGRES_DB: caseweaver
      POSTGRES_USER: caseweaver
      # This Compose file is a disposable, private-network development stack only.
      # Trust auth avoids a committed password; PostgreSQL has no published host port.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U caseweaver -d caseweaver &&
          psql -U caseweaver -d caseweaver -v ON_ERROR_STOP=1
          -c "SELECT 1 / COUNT(*) FROM pg_extension WHERE extname = 'vector';"
          > /dev/null
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - caseweaver_local_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    security_opt:
      - no-new-privileges:true

  # These are short-lived installation jobs, not application roles. Prisma and
  # pg-boss schema changes complete before the three long-running services start.
  migrate:
    image: ${CASEWEAVER_MIGRATION_IMAGE:-caseweaver-migration:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: migration
      args: *build-args
      provenance: false
      sbom: false
    environment:
      # The migration image defaults to production so its release entrypoint
      # rejects direct database values. This disposable local stack deliberately
      # uses its private trust-authenticated database URL instead of a secret
      # file, so it must explicitly retain development semantics.
      NODE_ENV: development
      DATABASE_URL: postgresql://caseweaver@postgres:5432/caseweaver
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - data

  queue-migrate:
    image: *backend-image
    # `backend` builds this exact local image during `up --build`; the job must
    # never attempt to pull an unpublished development image first.
    pull_policy: never
    command: ["node", "dist/main.js", "migrate-queue"]
    environment:
      # The backend image is production-hardened by default. This local-only
      # job connects directly to the disposable trust-authenticated database,
      # so it must not be treated as a production secret bootstrap.
      NODE_ENV: development
      DATABASE_URL: postgresql://caseweaver@postgres:5432/caseweaver
    depends_on:
      migrate:
        condition: service_completed_successfully
        required: true
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - data

  backend:
    image: *backend-image
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: standalone
      args: *build-args
      provenance: false
      sbom: false
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: "8081"
      DATABASE_URL: postgresql://caseweaver@postgres:5432/caseweaver
      API_WORKSPACE_ID: local-workspace
      API_PRINCIPAL_ID: local-administrator
      DATABASE_READINESS_TIMEOUT_MS: "5000"
      # Both published loopback spellings are trusted only in this disposable
      # local topology. Production requires explicit exact HTTPS origins.
      ADMIN_ALLOWED_ORIGINS: http://localhost:${CASEWEAVER_LOCAL_PORT:-8080},http://127.0.0.1:${CASEWEAVER_LOCAL_PORT:-8080}
      # Local password sign-in defaults to admin/admin. Override these host
      # variables before starting Compose if the loopback UI is shared.
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_DISABLE_LOGIN_AUTHENTICATION: ${ADMIN_DISABLE_LOGIN_AUTHENTICATION:-false}
      # Disposable local development storage. This non-production derivation
      # material is never a deployment credential and must be overridden with a
      # secret-manager value for any non-disposable installation.
      OBJECT_STORAGE_KIND: local
      OBJECT_STORAGE_BACKEND_ID: local-dev
      OBJECT_STORAGE_KEY_DERIVATION_SECRET: caseweaver-local-disposable-derivation-material-2026
      OBJECT_STORAGE_LOCAL_ROOT: /tmp/caseweaver-objects
      WORKER_GIT_TEMPORARY_DIRECTORY: /tmp/caseweaver-git
      WORKER_GIT_REMOTE_CACHE_DIRECTORY: /tmp/caseweaver-git-cache
      # Optional development-only provider credential passthrough. Configure
      # only its opaque env:CASEWEAVER_OPENROUTER_KEY reference in Admin; this
      # value is never served to the browser or persisted by the API.
      CASEWEAVER_OPENROUTER_KEY: ${CASEWEAVER_OPENROUTER_KEY:-}
      # OIDC is deliberately host-environment passthrough. Compose omits an unset
      # mapping-form variable rather than injecting an invalid empty value. A login
      # requires every value below plus a real provider/client registration.
      OIDC_ISSUER:
      OIDC_CLIENT_ID:
      OIDC_CLIENT_SECRET:
      OIDC_CALLBACK_URL:
      OIDC_EPHEMERAL_ENCRYPTION_KEY:
      OIDC_EPHEMERAL_KEY_ID:
      ADMIN_BOOTSTRAP_OIDC_SUBJECT:
      ADMIN_BOOTSTRAP_DISPLAY_NAME:
      TRUSTED_PROXY_CIDRS:
    depends_on:
      queue-migrate:
        condition: service_completed_successfully
        required: true
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - data
      - edge
      # Required only when a real OIDC issuer or a configured connector/provider
      # performs an allowed server-side call. The browser has no such access.
      - egress
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health/ready').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    image: ${CASEWEAVER_FRONTEND_IMAGE:-caseweaver-frontend:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: admin
      args: *build-args
      provenance: false
      sbom: false
    environment:
      # The UI proxy keeps cookie-session API traffic same-origin; it is neither
      # a security decision point nor an independent backend role.
      CASEWEAVER_ADMIN_API_BASE_URL: /
      CASEWEAVER_ADMIN_UI_TITLE: ${CASEWEAVER_ADMIN_UI_TITLE:-CaseWeaver Control Room (local)}
    depends_on:
      backend:
        condition: service_healthy
        required: true
    ports:
      - "127.0.0.1:${CASEWEAVER_LOCAL_PORT:-8080}:8080"
    volumes:
      - ./proxy/standalone-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
      - /var/cache/nginx:uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      # This attachment exists only to publish a loopback-only UI port. It never
      # carries database or service-to-service runtime traffic.
      - ingress
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/caseweaver-runtime-config.json && nginx -t && wget -q -O /dev/null http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

volumes:
  # The named volume keeps a local trial database across normal `down` / `up`.
  # Use `down -v` when a clean evaluation database is desired.
  caseweaver_local_postgres_data:

networks:
  # PostgreSQL is private even inside this disposable stack.
  data:
    internal: true
  edge:
    internal: true
  ingress:
  egress:
