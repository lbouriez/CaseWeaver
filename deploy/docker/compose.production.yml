name: caseweaver

# Production deployment uses only immutable image digests and one public TLS edge.
# Run `node deploy/docker/production-operations.mjs validate` before use; it rejects
# mutable images and contradictory profiles without rendering secret values.

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  DATABASE_URL_FILE: /run/secrets/runtime-database-url
  CASEWEAVER_APPLICATION_SECRETS_DIRECTORY: /run/caseweaver/application-secrets
  NODE_EXTRA_CA_CERTS: /run/secrets/trusted-ca-certificate
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_METRIC_EXPORT_INTERVAL_MS: ${OTEL_METRIC_EXPORT_INTERVAL_MS:-30000}
  OTEL_SERVICE_VERSION: ${CASEWEAVER_RELEASE_VERSION:?Set CASEWEAVER_RELEASE_VERSION.}

x-runtime-security: &runtime-security
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:uid=1000,gid=1000,mode=0700
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-runtime: &runtime
  <<: *runtime-security
  environment: *runtime-environment
  secrets:
    - source: runtime-database-url
      target: runtime-database-url
    - source: oidc-client-secret
      target: oidc-client-secret
    - source: oidc-ephemeral-encryption-key
      target: oidc-ephemeral-encryption-key
    - source: admin-login
      target: admin-login
    - source: admin-password
      target: admin-password
    - source: trusted-ca-certificate
      target: trusted-ca-certificate
  volumes:
    - type: bind
      source: ${CASEWEAVER_APPLICATION_SECRETS_DIRECTORY:?Set CASEWEAVER_APPLICATION_SECRETS_DIRECTORY to an operator-owned secret directory.}
      target: /run/caseweaver/application-secrets
      read_only: true
      bind:
        create_host_path: false
  depends_on:
    postgres:
      condition: service_healthy
      required: true

x-api-environment: &api-environment
  HOST: "0.0.0.0"
  PORT: "3000"
  DATABASE_READINESS_TIMEOUT_MS: ${DATABASE_READINESS_TIMEOUT_MS:-5000}
  API_WORKSPACE_ID: ${API_WORKSPACE_ID:?Set API_WORKSPACE_ID.}
  API_PRINCIPAL_ID: ${API_PRINCIPAL_ID:?Set API_PRINCIPAL_ID.}
  ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:?Set the exact public HTTPS Admin origin.}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?Set the fixed internal TLS-edge CIDR.}
  ADMIN_DISABLE_LOGIN_AUTHENTICATION: ${ADMIN_DISABLE_LOGIN_AUTHENTICATION:-true}
  ADMIN_ENABLE_PASSWORD_AUTHENTICATION: ${ADMIN_ENABLE_PASSWORD_AUTHENTICATION:-false}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc-client-secret
  OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-}
  OIDC_EPHEMERAL_ENCRYPTION_KEY_FILE: /run/secrets/oidc-ephemeral-encryption-key
  OIDC_EPHEMERAL_KEY_ID: ${OIDC_EPHEMERAL_KEY_ID:-}
  ADMIN_BOOTSTRAP_OIDC_SUBJECT: ${ADMIN_BOOTSTRAP_OIDC_SUBJECT:-}
  ADMIN_BOOTSTRAP_DISPLAY_NAME: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:-}
  ADMIN_LOGIN_FILE: /run/secrets/admin-login
  ADMIN_PASSWORD_FILE: /run/secrets/admin-password
  AI_CATALOG_LITELLM_COMMIT_SHA: ${AI_CATALOG_LITELLM_COMMIT_SHA:-}

x-worker-environment: &worker-environment
  OBJECT_STORAGE_KIND: ${OBJECT_STORAGE_KIND:?Set OBJECT_STORAGE_KIND to s3.}
  OBJECT_STORAGE_BACKEND_ID: ${OBJECT_STORAGE_BACKEND_ID:?Set OBJECT_STORAGE_BACKEND_ID.}
  OBJECT_STORAGE_KEY_DERIVATION_SECRET_FILE: /run/secrets/object-storage-key-derivation-secret
  OBJECT_STORAGE_KEY_PREFIX: ${OBJECT_STORAGE_KEY_PREFIX:-caseweaver}
  OBJECT_STORAGE_S3_ENDPOINT: ${OBJECT_STORAGE_S3_ENDPOINT:-}
  OBJECT_STORAGE_S3_REGION: ${OBJECT_STORAGE_S3_REGION:?Set OBJECT_STORAGE_S3_REGION.}
  OBJECT_STORAGE_S3_BUCKET: ${OBJECT_STORAGE_S3_BUCKET:?Set OBJECT_STORAGE_S3_BUCKET.}
  OBJECT_STORAGE_S3_FORCE_PATH_STYLE: ${OBJECT_STORAGE_S3_FORCE_PATH_STYLE:-false}
  OBJECT_STORAGE_S3_ENCRYPTION: ${OBJECT_STORAGE_S3_ENCRYPTION:-AES256}
  OBJECT_STORAGE_S3_KMS_KEY_ID: ${OBJECT_STORAGE_S3_KMS_KEY_ID:-}
  OBJECT_STORAGE_S3_ACCESS_KEY_ID_FILE: /run/secrets/object-storage-s3-access-key-id
  OBJECT_STORAGE_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/object-storage-s3-secret-access-key
  WORKER_GIT_TEMPORARY_DIRECTORY: ${WORKER_GIT_TEMPORARY_DIRECTORY:-/tmp/caseweaver-git}
  WORKER_GIT_REMOTE_CACHE_DIRECTORY: ${WORKER_GIT_REMOTE_CACHE_DIRECTORY:-/tmp/caseweaver-git-cache}

x-worker-secrets: &worker-secrets
  - source: runtime-database-url
    target: runtime-database-url
  - source: object-storage-key-derivation-secret
    target: object-storage-key-derivation-secret
  - source: object-storage-s3-access-key-id
    target: object-storage-s3-access-key-id
  - source: object-storage-s3-secret-access-key
    target: object-storage-s3-secret-access-key

x-standalone-secrets: &standalone-secrets
  - source: runtime-database-url
    target: runtime-database-url
  - source: oidc-client-secret
    target: oidc-client-secret
  - source: oidc-ephemeral-encryption-key
    target: oidc-ephemeral-encryption-key
  - source: admin-login
    target: admin-login
  - source: admin-password
    target: admin-password
  - source: trusted-ca-certificate
    target: trusted-ca-certificate
  - source: object-storage-key-derivation-secret
    target: object-storage-key-derivation-secret
  - source: object-storage-s3-access-key-id
    target: object-storage-s3-access-key-id
  - source: object-storage-s3-secret-access-key
    target: object-storage-s3-secret-access-key

x-object-store-operations: &object-store-operations
  image: ${CASEWEAVER_S3_OPERATIONS_IMAGE:?Set CASEWEAVER_S3_OPERATIONS_IMAGE to a pinned S3-compatible operations image.}
  profiles: ["operations"]
  restart: "no"
  # This utility receives the same least-privilege object-store credential as
  # the runtime only when an operator explicitly runs backup or restore. The
  # credential is loaded from Docker secret files inside the container; it is
  # never added to Compose environment interpolation or process arguments.
  entrypoint:
    - sh
    - -ec
    - >-
      export AWS_ACCESS_KEY_ID="$(cat /run/secrets/object-storage-s3-access-key-id)";
      export AWS_SECRET_ACCESS_KEY="$(cat /run/secrets/object-storage-s3-secret-access-key)";
      export AWS_DEFAULT_REGION="$${OBJECT_STORAGE_S3_REGION}";
      export AWS_EC2_METADATA_DISABLED=true;
      if [ -s /run/secrets/trusted-ca-certificate ]; then export AWS_CA_BUNDLE=/run/secrets/trusted-ca-certificate; fi;
      exec aws "$$@"
    - --
  environment:
    HOME: /tmp
    OBJECT_STORAGE_S3_REGION: ${OBJECT_STORAGE_S3_REGION:?Set OBJECT_STORAGE_S3_REGION.}
  secrets:
    - source: object-storage-s3-access-key-id
      target: object-storage-s3-access-key-id
    - source: object-storage-s3-secret-access-key
      target: object-storage-s3-secret-access-key
    - source: trusted-ca-certificate
      target: trusted-ca-certificate
  networks:
    - egress
  read_only: true
  tmpfs:
    - /tmp:uid=1000,gid=1000,mode=0700
  user: "1000:1000"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-attachment-runtime-environment: &attachment-runtime-environment
  WORKER_ATTACHMENT_RUNTIME_SOCKET_PATH: /var/run/caseweaver-attachments/processor.sock
  WORKER_ATTACHMENT_RUNTIME_JOBS_DIRECTORY: /var/run/caseweaver-attachments/jobs
  WORKER_ATTACHMENT_RUNTIME_TIMEOUT_MS: ${WORKER_ATTACHMENT_RUNTIME_TIMEOUT_MS:-60000}
  WORKER_ATTACHMENT_RUNTIME_MAXIMUM_MEMORY_BYTES: ${WORKER_ATTACHMENT_RUNTIME_MAXIMUM_MEMORY_BYTES:-536870912}
  WORKER_ATTACHMENT_RUNTIME_MAXIMUM_INPUT_BYTES: ${WORKER_ATTACHMENT_RUNTIME_MAXIMUM_INPUT_BYTES:-67108864}
  WORKER_ATTACHMENT_RUNTIME_MAXIMUM_OUTPUT_BYTES: ${WORKER_ATTACHMENT_RUNTIME_MAXIMUM_OUTPUT_BYTES:-8388608}
  WORKER_ATTACHMENT_RUNTIME_MAXIMUM_FILES: ${WORKER_ATTACHMENT_RUNTIME_MAXIMUM_FILES:-1000}
  WORKER_ATTACHMENT_RUNTIME_MAXIMUM_EXPANDED_BYTES: ${WORKER_ATTACHMENT_RUNTIME_MAXIMUM_EXPANDED_BYTES:-268435456}
  WORKER_ATTACHMENT_RUNTIME_MAXIMUM_EXTRACTED_FILE_BYTES: ${WORKER_ATTACHMENT_RUNTIME_MAXIMUM_EXTRACTED_FILE_BYTES:-33554432}
  WORKER_ATTACHMENT_RUNTIME_MAXIMUM_ARCHIVE_DEPTH: ${WORKER_ATTACHMENT_RUNTIME_MAXIMUM_ARCHIVE_DEPTH:-16}
  WORKER_ATTACHMENT_RUNTIME_MAXIMUM_COMPRESSION_RATIO: ${WORKER_ATTACHMENT_RUNTIME_MAXIMUM_COMPRESSION_RATIO:-100}

services:
  postgres:
    image: ${CASEWEAVER_POSTGRES_IMAGE:?Set CASEWEAVER_POSTGRES_IMAGE to a pgvector digest.}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caseweaver}
      POSTGRES_USER: ${POSTGRES_USER:-caseweaver_migrator}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      CASEWEAVER_RUNTIME_DATABASE_ROLE: ${CASEWEAVER_RUNTIME_DATABASE_ROLE:-caseweaver_runtime}
    secrets:
      - source: postgres-password
        target: postgres-password
      - source: runtime-database-password
        target: runtime-database-password
    volumes:
      - caseweaver_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1
          -c "SELECT 1 / COUNT(*) FROM pg_extension WHERE extname = 'vector';"
          > /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    # The official PostgreSQL entrypoint starts as root only long enough to own a
    # fresh named volume and drop to its postgres account. `no-new-privileges` or
    # `cap_drop: ALL` would prevent that safe bootstrap. This private, portless
    # service is the sole exception; CaseWeaver images remain non-root and fully
    # capability-dropped.

  migrate:
    image: ${CASEWEAVER_MIGRATION_IMAGE:?Set CASEWEAVER_MIGRATION_IMAGE to a pinned migration image.}
    profiles: ["migrate"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/migration-database-url
      OTEL_SDK_DISABLED: "true"
    secrets:
      - source: migration-database-url
        target: migration-database-url
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  queue-migrate:
    image: ${CASEWEAVER_STANDALONE_IMAGE:?Set CASEWEAVER_STANDALONE_IMAGE to a pinned standalone image.}
    profiles: ["migrate"]
    restart: "no"
    command: ["node", "dist/main.js", "migrate-queue"]
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/migration-database-url
    secrets:
      - source: migration-database-url
        target: migration-database-url
    networks:
      - data
    depends_on:
      migrate:
        condition: service_completed_successfully
        required: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  grant-runtime:
    image: ${CASEWEAVER_MIGRATION_IMAGE:?Set CASEWEAVER_MIGRATION_IMAGE to a pinned migration image.}
    profiles: ["migrate"]
    restart: "no"
    command: ["/usr/local/bin/caseweaver-grant-runtime-role"]
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/migration-database-url
      CASEWEAVER_RUNTIME_DATABASE_ROLE: ${CASEWEAVER_RUNTIME_DATABASE_ROLE:-caseweaver_runtime}
    secrets:
      - source: migration-database-url
        target: migration-database-url
    networks:
      - data
    depends_on:
      queue-migrate:
        condition: service_completed_successfully
        required: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  tls-material:
    image: ${CASEWEAVER_EDGE_IMAGE:?Set CASEWEAVER_EDGE_IMAGE to a pinned nginx-unprivileged image.}
    profiles: ["standalone", "distributed"]
    restart: unless-stopped
    # Docker Compose implements file-backed secrets as root-owned bind mounts.
    # This isolated no-network job is the only root process in the edge path: it
    # stages a renewal-safe in-memory copy owned by the unprivileged Nginx UID.
    user: "0:0"
    command:
      - sh
      - -ec
      - >-
        umask 077;
        cp /run/secrets/tls-certificate /run/caseweaver-tls/certificate.pem;
        cp /run/secrets/tls-private-key /run/caseweaver-tls/private-key.pem;
        chown 101:101 /run/caseweaver-tls/certificate.pem /run/caseweaver-tls/private-key.pem;
        chmod 0444 /run/caseweaver-tls/certificate.pem;
        chmod 0400 /run/caseweaver-tls/private-key.pem;
        exec tail -f /dev/null
    secrets:
      - source: tls-certificate
        target: tls-certificate
      - source: tls-private-key
        target: tls-private-key
    volumes:
      - caseweaver_tls_runtime:/run/caseweaver-tls
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:uid=0,gid=0,mode=0700
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -r /run/caseweaver-tls/certificate.pem && test -r /run/caseweaver-tls/private-key.pem"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 1s

  edge:
    image: ${CASEWEAVER_EDGE_IMAGE:?Set CASEWEAVER_EDGE_IMAGE to a pinned nginx-unprivileged image.}
    profiles: ["standalone", "distributed"]
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_FILTER: CASEWEAVER_EDGE_.*
      CASEWEAVER_EDGE_PUBLIC_HTTPS_PORT: ${CASEWEAVER_EDGE_PUBLIC_HTTPS_PORT:?Set the public HTTPS port.}
      CASEWEAVER_EDGE_API_UPSTREAM: ${CASEWEAVER_EDGE_API_UPSTREAM:?Set the explicitly selected API upstream.}
      CASEWEAVER_EDGE_WEBHOOK_UPSTREAM: ${CASEWEAVER_EDGE_WEBHOOK_UPSTREAM:?Set the explicitly selected webhook upstream.}
    ports:
      - "${CASEWEAVER_EDGE_HTTP_BINDING:?Set CASEWEAVER_EDGE_HTTP_BINDING.}:8080"
      - "${CASEWEAVER_EDGE_HTTPS_BINDING:?Set CASEWEAVER_EDGE_HTTPS_BINDING.}:8443"
    volumes:
      - ./proxy/production-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - caseweaver_tls_runtime:/run/caseweaver-tls:ro
    networks:
      - ingress
      - application
    depends_on:
      admin:
        condition: service_healthy
        required: true
      tls-material:
        condition: service_healthy
        required: true
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /var/run:uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  admin:
    image: ${CASEWEAVER_ADMIN_IMAGE:?Set CASEWEAVER_ADMIN_IMAGE to a pinned Admin image.}
    profiles: ["standalone", "distributed"]
    restart: unless-stopped
    environment:
      CASEWEAVER_ADMIN_API_BASE_URL: /
      CASEWEAVER_ADMIN_UI_TITLE: ${CASEWEAVER_ADMIN_UI_TITLE:-CaseWeaver Control Room}
    networks:
      - application
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
      - /var/cache/nginx:uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/caseweaver-runtime-config.json && nginx -t && wget -q -O /dev/null http://127.0.0.1:8080/runtime-config.json"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  standalone:
    <<: *runtime
    image: ${CASEWEAVER_STANDALONE_IMAGE:?Set CASEWEAVER_STANDALONE_IMAGE to a pinned standalone image.}
    profiles: ["standalone"]
    environment:
      <<: [*runtime-environment, *api-environment, *worker-environment, *attachment-runtime-environment]
      OTEL_SERVICE_NAME: caseweaver-standalone
    secrets: *standalone-secrets
    volumes:
      - type: bind
        source: ${CASEWEAVER_APPLICATION_SECRETS_DIRECTORY:?Set CASEWEAVER_APPLICATION_SECRETS_DIRECTORY to an operator-owned secret directory.}
        target: /run/caseweaver/application-secrets
        read_only: true
        bind:
          create_host_path: false
      - caseweaver_attachment_runtime:/var/run/caseweaver-attachments
    networks:
      - application
      - data
      - egress
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      attachment-processor:
        condition: service_healthy
        required: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    <<: *runtime
    image: ${CASEWEAVER_API_IMAGE:?Set CASEWEAVER_API_IMAGE to a pinned API image.}
    profiles: ["distributed"]
    environment:
      <<: [*runtime-environment, *api-environment]
      OTEL_SERVICE_NAME: caseweaver-api
    networks:
      - application
      - data
      - egress
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  webhook:
    <<: *runtime-security
    image: ${CASEWEAVER_WEBHOOK_IMAGE:?Set CASEWEAVER_WEBHOOK_IMAGE to a pinned webhook image.}
    profiles: ["distributed"]
    environment:
      <<: *runtime-environment
      OTEL_SERVICE_NAME: caseweaver-webhook
      # The webhook ingress owns only verified transport and durable enqueueing.
      # It does not resolve connector/provider application secrets, so do not make
      # the generic runtime entrypoint require an unmounted secret directory.
      CASEWEAVER_APPLICATION_SECRETS_DIRECTORY: ""
      WEBHOOK_HOST: "0.0.0.0"
      WEBHOOK_PORT: "8081"
    secrets:
      - source: runtime-database-url
        target: runtime-database-url
    networks:
      - application
      - data
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    healthcheck:
      # Probe the already-running ingress. A separate CLI command would only
      # prove that the image can execute JavaScript, not that HTTP admission and
      # its bounded database readiness probe are serving.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  scheduler:
    <<: *runtime-security
    image: ${CASEWEAVER_SCHEDULER_IMAGE:?Set CASEWEAVER_SCHEDULER_IMAGE to a pinned scheduler image.}
    profiles: ["distributed"]
    environment:
      <<: *runtime-environment
      OTEL_SERVICE_NAME: caseweaver-scheduler
      # Schedulers only produce durable requests from retained configuration;
      # secret resolution remains a worker responsibility.
      CASEWEAVER_APPLICATION_SECRETS_DIRECTORY: ""
    secrets:
      - source: runtime-database-url
        target: runtime-database-url
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    healthcheck:
      # Docker health commands bypass the image ENTRYPOINT. Reuse the file-secret
      # loader so scheduler readiness receives the runtime URL without exposing it
      # in Compose environment values.
      test: ["CMD", "/usr/local/bin/caseweaver-entrypoint", "node", "dist/main.js", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    <<: *runtime-security
    image: ${CASEWEAVER_WORKER_IMAGE:?Set CASEWEAVER_WORKER_IMAGE to a pinned worker image.}
    profiles: ["distributed"]
    environment:
      <<: [*runtime-environment, *worker-environment, *attachment-runtime-environment]
      OTEL_SERVICE_NAME: caseweaver-worker
    secrets: *worker-secrets
    volumes:
      - type: bind
        source: ${CASEWEAVER_APPLICATION_SECRETS_DIRECTORY:?Set CASEWEAVER_APPLICATION_SECRETS_DIRECTORY to an operator-owned secret directory.}
        target: /run/caseweaver/application-secrets
        read_only: true
        bind:
          create_host_path: false
      - caseweaver_attachment_runtime:/var/run/caseweaver-attachments
    networks:
      - data
      - egress
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      attachment-processor:
        condition: service_healthy
        required: true
    healthcheck:
      # Docker health commands bypass the image ENTRYPOINT. Reuse the
      # file-secret loader so the bounded worker PostgreSQL probe receives the
      # runtime URL without putting a credential in the Compose environment.
      test: ["CMD", "/usr/local/bin/caseweaver-entrypoint", "node", "dist/main.js", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  attachment-processor:
    image: ${CASEWEAVER_ATTACHMENT_PROCESSOR_IMAGE:?Set CASEWEAVER_ATTACHMENT_PROCESSOR_IMAGE to a pinned attachment processor image.}
    profiles: ["standalone", "distributed"]
    restart: unless-stopped
    environment: *attachment-runtime-environment
    read_only: true
    volumes:
      - caseweaver_attachment_runtime:/var/run/caseweaver-attachments
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/caseweaver-attachments/processor.sock"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  object-store-operations:
    <<: *object-store-operations

secrets:
  postgres-password:
    file: ${CASEWEAVER_POSTGRES_PASSWORD_FILE:?Set CASEWEAVER_POSTGRES_PASSWORD_FILE.}
  runtime-database-password:
    file: ${CASEWEAVER_RUNTIME_DATABASE_PASSWORD_FILE:?Set CASEWEAVER_RUNTIME_DATABASE_PASSWORD_FILE.}
  migration-database-url:
    file: ${CASEWEAVER_MIGRATION_DATABASE_URL_FILE:?Set CASEWEAVER_MIGRATION_DATABASE_URL_FILE.}
  runtime-database-url:
    file: ${CASEWEAVER_RUNTIME_DATABASE_URL_FILE:?Set CASEWEAVER_RUNTIME_DATABASE_URL_FILE.}
  oidc-client-secret:
    file: ${CASEWEAVER_OIDC_CLIENT_SECRET_FILE:?Set CASEWEAVER_OIDC_CLIENT_SECRET_FILE (an empty file when OIDC is disabled).}
  oidc-ephemeral-encryption-key:
    file: ${CASEWEAVER_OIDC_EPHEMERAL_ENCRYPTION_KEY_FILE:?Set CASEWEAVER_OIDC_EPHEMERAL_ENCRYPTION_KEY_FILE (an empty file when OIDC is disabled).}
  admin-login:
    file: ${CASEWEAVER_ADMIN_LOGIN_FILE:?Set CASEWEAVER_ADMIN_LOGIN_FILE (an empty file when password login is disabled).}
  admin-password:
    file: ${CASEWEAVER_ADMIN_PASSWORD_FILE:?Set CASEWEAVER_ADMIN_PASSWORD_FILE (an empty file when password login is disabled).}
  object-storage-key-derivation-secret:
    file: ${CASEWEAVER_OBJECT_STORAGE_KEY_DERIVATION_SECRET_FILE:?Set CASEWEAVER_OBJECT_STORAGE_KEY_DERIVATION_SECRET_FILE (an empty file when object storage is disabled).}
  object-storage-s3-access-key-id:
    file: ${CASEWEAVER_OBJECT_STORAGE_S3_ACCESS_KEY_ID_FILE:?Set CASEWEAVER_OBJECT_STORAGE_S3_ACCESS_KEY_ID_FILE (an empty file when S3 is disabled).}
  object-storage-s3-secret-access-key:
    file: ${CASEWEAVER_OBJECT_STORAGE_S3_SECRET_ACCESS_KEY_FILE:?Set CASEWEAVER_OBJECT_STORAGE_S3_SECRET_ACCESS_KEY_FILE (an empty file when S3 is disabled).}
  trusted-ca-certificate:
    file: ${CASEWEAVER_TRUSTED_CA_FILE:?Set CASEWEAVER_TRUSTED_CA_FILE (an empty file when only public trust roots are needed).}
  tls-certificate:
    file: ${CASEWEAVER_TLS_CERTIFICATE_FILE:?Set CASEWEAVER_TLS_CERTIFICATE_FILE.}
  tls-private-key:
    file: ${CASEWEAVER_TLS_PRIVATE_KEY_FILE:?Set CASEWEAVER_TLS_PRIVATE_KEY_FILE.}

volumes:
  caseweaver_postgres_data:
  caseweaver_tls_runtime:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=101,gid=101,mode=0700,size=1048576
  caseweaver_attachment_runtime:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=1000,gid=1000,mode=0700,size=536870912

networks:
  ingress:
  application:
    internal: true
    ipam:
      config:
        - subnet: ${CASEWEAVER_APPLICATION_SUBNET:-172.28.0.0/24}
  data:
    internal: true
  egress:
    ipam:
      config:
        - subnet: ${CASEWEAVER_EGRESS_SUBNET:-172.29.0.0/24}
